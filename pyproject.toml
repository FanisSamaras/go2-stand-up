[project]
name = "go2-stand-up"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FanisSamaras", email = "fanissamaras1@gmail.com" },
    { name = "ManosDrakos", email = "drakomanios@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gym-quadruped>=1.1.5",
    "matplotlib>=3.11.1",
    "mujoco>=3.12.0",
    "numpy>=2.5.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", marker = "sys_platform == 'linux'"},
    {index = "pytorch-cu132", marker = "sys_platform == 'win32'"}
]
torchvision = [
    {index = "pytorch-cpu", marker = "sys_platform == 'linux'"},
    {index = "pytorch-cu132", marker = "sys_platform == 'win32'"}
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true


[project.scripts]
go2-stand-up = "go2_stand_up:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
